name: AI TTS Branch Build

on:
  push:
    branches:
      - feature/ai-tts-and-rule-optimization
  workflow_dispatch:

concurrency:
  group: ai-tts-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug --stacktrace --warning-mode all

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legado-ai-tts-debug-${{ github.run_number }}
          path: app/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legado-ai-tts-build-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
